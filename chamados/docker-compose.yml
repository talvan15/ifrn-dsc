services:
  db:
    image: postgres:16
    container_name: chamados-db
    environment:
      POSTGRES_DB: ${DB_NAME:-chamados}
      POSTGRES_USER: ${DB_USER:-chamados}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chamados123}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-chamados} -d ${DB_NAME:-chamados}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: chamados-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-chamados}
      DB_USER: ${DB_USER:-chamados}
      DB_PASSWORD: ${DB_PASSWORD:-chamados123}
    ports:
      - "8080:8080"

volumes:
  pgdata:
